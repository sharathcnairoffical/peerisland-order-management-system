## Order Management Production Configuration

#Postgres Database Config
spring.datasource.url=${ORDER_MANAGEMENT_DB_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=false

# Control Hikari connection pool size
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MINIMUM_IDLE}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_IDLE_TIMEOUT}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_MAX_LIFETIME}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT}

# Swagger Disabled for prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
spring.sql.init.mode=never
