spring.profiles.active=local
spring.datasource.url=jdbc:h2:mem:orders_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt.access.expiry=3600000
jwt.refresh.expiry=86400000
orders.pending-to-processing-interval-ms=300000
security.allow-credentials=false
security.allowed-origins=*
security.allowed-headers=*
security.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
security.allowed-public-apis=/v1/customers/**,/swagger-ui/**,/v3/api-docs/**,/public/**
